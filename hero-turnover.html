<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TurnOver Hero</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap');
    :root{--orange:#ff571c;--ink:#111719;--muted:#828384;--paper:#f8f7f4}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}
    button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
    button:focus-visible{outline:3px solid #ff9b65;outline-offset:5px}
    .hero{max-width:1600px;min-height:780px;height:100svh;max-height:1050px;margin:auto;position:relative;overflow:hidden;background:radial-gradient(ellipse at 76% 55%,#ffe0d250,transparent 48%),var(--paper)}
    .copy{position:relative;z-index:3;width:49%;padding:110px 0 0 5.5%;pointer-events:none}
    .copy button{pointer-events:auto}
    .eyebrow{font-size:11px;font-weight:600;display:inline-flex;gap:10px;align-items:center;background:#ffffffb3;border:1px solid white;padding:7px 11px;border-radius:30px}
    .dot{width:8px;height:8px;background:var(--orange);border-radius:50%;box-shadow:0 0 0 3px #ff571c0c}
    h1{font-family:Manrope,sans-serif;font-size:clamp(42px,4.7vw,72px);line-height:1.075;letter-spacing:-3.7px;font-weight:800;margin:25px 0 20px}
    h1 span{color:var(--orange);white-space:nowrap}
    .intro{max-width:325px;font-size:14px;line-height:1.7;color:var(--muted);margin:0}
    .actions{display:flex;align-items:center;gap:23px;margin-top:27px}
    .pill{border:0;border-radius:40px;padding:14px 23px;background:var(--orange);color:white;display:inline-flex;align-items:center;gap:21px;font-size:12px;font-weight:600;transition:transform .2s,box-shadow .2s}
    .pill:hover{transform:translateY(-2px);box-shadow:0 8px 24px #ff571c26}
    .arrow{font-size:21px;line-height:1;font-weight:400}
    .story{display:flex;align-items:center;gap:11px;border:0;background:none;padding:0;text-align:left}
    .play{width:39px;height:39px;display:grid;place-items:center;border:1px solid #d3d4d3;outline:4px solid #ffffff60;border-radius:50%;color:var(--orange);font-size:13px;padding-left:2px}
    .story strong{display:block;font-size:11px;font-weight:600}
    .story small{display:block;font-size:10px;color:var(--muted);margin-top:3px}
    .stats{display:flex;margin-top:58px;width:420px;max-width:100%}
    .stat{padding:0 17px;border-right:1px solid #dededb;flex:1}
    .stat:first-child{padding-left:0}
    .stat:last-child{border:0}
    .stat strong{display:block;font-family:Manrope,sans-serif;font-size:20px;letter-spacing:-.7px}
    .stat span{display:block;font-size:9px;color:var(--muted);margin-top:4px;white-space:nowrap}
    .latest{margin-top:65px;display:flex;align-items:center;gap:15px;width:330px;max-width:100%;padding:12px;background:#ffffff70;border:1px solid white;border-radius:18px;box-shadow:0 12px 28px #353d4710;text-align:left;color:var(--ink)}
    .latest img{width:84px;height:70px;object-fit:cover;object-position:50% 25%;border-radius:9px;background:#ecebe7}
    .latest strong{font-size:11px;display:block;margin-bottom:7px}
    .latest p{font-size:10px;line-height:1.6;color:var(--muted);margin:0}
    .circle-arrow{width:32px;height:32px;border:1px solid white;border-radius:50%;display:grid;place-items:center;flex-shrink:0;color:#777}
    .latest .circle-arrow{margin-left:auto}
    .visual{position:absolute;z-index:1;left:27%;top:0;width:78%;height:100%;pointer-events:none}
    #scene{width:100%;height:100%;display:block}
    .ambient{position:absolute;width:470px;height:240px;background:#ff783430;filter:blur(55px);bottom:-80px;right:9%;border-radius:50%;pointer-events:none}
    .services{position:absolute;inset:0;z-index:4;pointer-events:none}
    .service{position:absolute;width:215px;padding:17px 13px;display:flex;align-items:flex-start;gap:12px;border:1px solid #ffffffdc;border-radius:18px;background:linear-gradient(120deg,#ffffffb0,#ffffff42);backdrop-filter:blur(9px);pointer-events:auto;text-align:left;color:var(--ink);transition:transform .2s}
    .service:hover{transform:translateX(-5px)}
    .service:nth-child(1){top:100px;right:7%}
    .service:nth-child(2){top:265px;right:1.5%}
    .service:nth-child(3){top:430px;right:2%}
    .service:before{content:'';position:absolute;left:-45px;top:50%;width:40px;height:1px;background:linear-gradient(90deg,transparent,white);transform:rotate(-35deg);transform-origin:right}
    .service-icon{color:var(--orange);width:30px;height:30px;flex-shrink:0;display:grid;place-items:center;border-radius:50%;background:#fff3eb;box-shadow:0 0 0 5px #ffffff50;font-size:18px}
    .service h2{font-size:11px;margin:0 0 7px;font-weight:700}
    .service p{font-size:10px;line-height:1.55;margin:0;color:#93918e}
    .service .circle-arrow{width:23px;height:23px;font-size:16px;margin:auto 0 auto auto}
    .motion{position:absolute;right:5.5%;bottom:25px;z-index:5;font-size:10px;color:#898984;border:1px solid #ffffffa0;border-radius:30px;background:#ffffff60;backdrop-filter:blur(8px);padding:9px 13px}
    dialog{border:1px solid white;border-radius:24px;padding:35px;max-width:480px;width:calc(100% - 36px);background:var(--paper);box-shadow:0 25px 100px #0003}
    dialog::backdrop{background:#17212966;backdrop-filter:blur(8px)}
    dialog h2{font:800 30px Manrope,sans-serif;letter-spacing:-1px;margin:15px 0}
    dialog p{font-size:14px;line-height:1.8;color:#727575}
    .close{float:right;background:white;border:0;border-radius:50%;width:32px;height:32px;font-size:20px}
    @media(min-width:1450px){
      .copy{padding-top:140px}
      .service:nth-child(1){top:135px}
      .service:nth-child(2){top:315px}
      .service:nth-child(3){top:500px}
    }
    @media(max-width:1100px){
      .hero{min-height:740px}
      h1{letter-spacing:-2.5px;font-size:47px}
      .copy{padding-top:85px;width:51%}
      .intro{font-size:12px;max-width:280px}
      .service{width:180px;padding:13px 10px;gap:8px}
      .service p{font-size:9px}
      .service:nth-child(1){top:85px}
      .service:nth-child(2){top:240px}
      .service:nth-child(3){top:390px}
      .stats{margin-top:45px;width:370px}
      .stat{padding:0 12px}.stat span{font-size:8px}
      .latest{margin-top:47px;width:290px}
      .visual{left:25%;width:83%}
    }
    @media(max-width:760px){
      .hero{height:auto;max-height:none;min-height:1140px}
      .copy{width:100%;padding:48px 6% 0}
      h1{font-size:clamp(39px,8.3vw,61px);letter-spacing:-2.5px;margin-top:20px}
      .intro{max-width:340px;font-size:13px}
      .stats{width:420px;margin-top:32px}
      .stat span{font-size:9px}
      .latest{margin-top:26px;width:290px}
      .visual{top:500px;left:-16%;width:125%;height:630px}
      .services .service{width:160px}
      .service:nth-child(1){top:565px;right:4%}
      .service:nth-child(2){top:720px;right:1.5%}
      .service:nth-child(3){top:875px;right:3%}
      .service-icon{width:24px;height:24px;font-size:15px}
      .service h2{font-size:10px}
      .service p{font-size:8px}
      .motion{bottom:18px;right:6%}
      .ambient{right:-100px;bottom:0}
    }
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="ambient"></div>
      <div class="visual">
        <canvas id="scene" role="img" aria-label="Cyber avatar wrapped in a flowing orange spiral ribbon"></canvas>
      </div>
      <div class="copy">
        <div class="eyebrow"><span class="dot"></span>Creative Digital Agency</div>
        <h1 id="hero-title">We Build Brands<br><span>That Stand Out</span></h1>
        <p class="intro">Turnover is a creative agency helping modern businesses grow through strategy, design, and digital experiences.</p>
        <div class="actions">
          <button class="pill" data-info="contact">Let's Work Together <span class="arrow">→</span></button>
          <button class="story" data-info="story"><span class="play">▶</span><span><strong>Watch Our Story</strong><small>2 min</small></span></button>
        </div>
        <div class="stats">
          <div class="stat"><strong>320+</strong><span>Happy Clients</span></div>
          <div class="stat"><strong>5+</strong><span>Years Experience</span></div>
          <div class="stat"><strong>150+</strong><span>Projects Completed</span></div>
          <div class="stat"><strong>98%</strong><span>Client Satisfaction</span></div>
        </div>
        <button class="latest" data-info="work">
          <img id="thumbnail" alt="Cyber avatar branding concept">
          <div><strong>Our Latest Work</strong><p>Branding for a modern<br>tech company.</p></div>
          <span class="circle-arrow">→</span>
        </button>
      </div>
      <div class="services">
        <button class="service" data-info="brand">
          <span class="service-icon">◈</span>
          <div><h2>Brand Strategy</h2><p>Turn ideas into powerful<br>brand stories.</p></div>
          <span class="circle-arrow">→</span>
        </button>
        <button class="service" data-info="design">
          <span class="service-icon">✎</span>
          <div><h2>Creative Design</h2><p>Beautiful designs that<br>make an impact.</p></div>
          <span class="circle-arrow">→</span>
        </button>
        <button class="service" data-info="growth">
          <span class="service-icon">▥</span>
          <div><h2>Digital Growth</h2><p>More traffic. More leads.<br>More growth.</p></div>
          <span class="circle-arrow">→</span>
        </button>
      </div>
      <button class="motion" id="motion" aria-pressed="false">Ⅱ Pause ribbon</button>
    </section>
  </main>
  <dialog id="details">
    <button class="close" aria-label="Close dialog">×</button>
    <div class="eyebrow"><span class="dot"></span>TurnOver Studio</div>
    <h2 id="dialog-title"></h2>
    <p id="dialog-copy"></p>
  </dialog>
  <script>
    const AVATAR_URL="./cyber_avatar.png";
    document.getElementById("thumbnail").src="./cyber_avatar.png";
    const canvas=document.getElementById("scene");
    const ctx=canvas.getContext("2d");
    const reducedMotion=matchMedia("(prefers-reduced-motion: reduce)");
    let paused=reducedMotion.matches;
    let avatar=null,width=900,height=800,phase=0,last=0,raf=0;

    const config={
      speed:32,           // Text travel in design-space pixels per second.
      ribbonHeight:35,
      fontSize:15
    };

    const sections=[
      {
        front:false,
        points:[[980,145],[740,215],[62,365],[82,435]],
        colors:["#ffc456","#ff9939","#fa7a2b"]
      },
      {
        front:true,
        points:[[82,435],[99,495],[330,540],[465,507]],
        colors:["#ffb36a","#ff7e35","#ed5b20"]
      },
      {
        front:false,
        points:[[465,507],[600,474],[836,451],[840,500]],
        colors:["#ffbe51","#ffa135","#f78a26"]
      },
      {
        front:true,
        points:[[840,500],[844,560],[385,730],[190,667]],
        colors:["#ffb941","#ff8b29","#f1641b"]
      }
    ];

    function bezier(points,t){
      const u=1-t;
      return {
        x:u*u*u*points[0][0]+3*u*u*t*points[1][0]+3*u*t*t*points[2][0]+t*t*t*points[3][0],
        y:u*u*u*points[0][1]+3*u*u*t*points[1][1]+3*u*t*t*points[2][1]+t*t*t*points[3][1]
      };
    }

    let totalLength=0;
    sections.forEach(section=>{
      section.start=totalLength;
      section.samples=[];
      let previous=null;
      for(let i=0;i<=240;i++){
        const p=bezier(section.points,i/240);
        if(previous)totalLength+=Math.hypot(p.x-previous.x,p.y-previous.y);
        section.samples.push({...p,d:totalLength});
        previous=p;
      }
      section.end=totalLength;
    });

    const mod=(x,n)=>(x%n+n)%n;

    function atDistance(section,d){
      const a=section.samples;
      let lo=0,hi=a.length-1;
      while(lo+1<hi){
        const mid=(lo+hi)>>1;
        if(a[mid].d<d)lo=mid;else hi=mid;
      }
      const p=a[lo],q=a[hi];
      const f=Math.max(0,Math.min(1,(d-p.d)/(q.d-p.d||1)));
      return {x:p.x+(q.x-p.x)*f,y:p.y+(q.y-p.y)*f,dx:q.x-p.x,dy:q.y-p.y};
    }

    let glyphs=[],textPeriod=1;
    function prepareText(){
      ctx.font=`500 ${config.fontSize}px "DM Sans",sans-serif`;
      const phrase="Strategy   ·   Design   ·   Digital   ·   Growth   ·   ";
      glyphs=[];
      let advance=0;
      for(const char of phrase){
        const w=ctx.measureText(char).width+.4;
        glyphs.push({char,offset:advance+w/2});
        advance+=w;
      }
      textPeriod=advance;
    }
    prepareText();

    function paintSection(section){
      const pts=section.samples;
      const half=config.ribbonHeight/2;
      const minY=Math.min(...pts.map(p=>p.y))-half;
      const maxY=Math.max(...pts.map(p=>p.y))+half;
      const fill=ctx.createLinearGradient(100,minY,840,maxY);
      fill.addColorStop(0,section.colors[0]);
      fill.addColorStop(.48,section.colors[1]);
      fill.addColorStop(1,section.colors[2]);

      ctx.beginPath();
      pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y-half):ctx.moveTo(p.x,p.y-half));
      for(let i=pts.length-1;i>=0;i--)ctx.lineTo(pts[i].x,pts[i].y+half);
      ctx.closePath();
      ctx.fillStyle=fill;ctx.fill();

      [-half,half].forEach((offset,i)=>{
        ctx.beginPath();
        pts.forEach((p,j)=>j?ctx.lineTo(p.x,p.y+offset):ctx.moveTo(p.x,p.y+offset));
        ctx.strokeStyle=i?"rgba(205,77,13,.22)":"rgba(255,240,185,.75)";
        ctx.lineWidth=i?.9:1.4;
        ctx.stroke();
      });

      ctx.save();
      ctx.font=`500 ${config.fontSize}px "DM Sans",sans-serif`;
      ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillStyle=section.front?"#fff2dbe8":"#fff6e2bf";
      const shift=mod(phase,textPeriod);

      for(let base=-textPeriod;base<totalLength+textPeriod;base+=textPeriod){
        for(const glyph of glyphs){
          const d=base+glyph.offset+shift;
          if(d<section.start||d>=section.end)continue;
          const p=atDistance(section,d);
          let angle=Math.atan2(p.dy,p.dx);
          const reversed=p.dx<0;
          if(reversed)angle+=Math.PI;
          const sampleGlyph=reversed
            ? glyphs[glyphs.length-1-glyphs.indexOf(glyph)].char
            : glyph.char;
          const foreshorten=Math.max(.3,Math.abs(p.dx)/Math.hypot(p.dx,p.dy));
          ctx.save();
          ctx.translate(p.x,p.y+1);
          ctx.rotate(angle);
          ctx.scale(foreshorten,1);
          ctx.fillText(sampleGlyph,0,0);
          ctx.restore();
        }
      }
      ctx.restore();
    }

    function paintText(section){
      const half=config.ribbonHeight/2;
      ctx.save();
      ctx.beginPath();
      section.samples.forEach((p,i)=>i?ctx.lineTo(p.x,p.y-half):ctx.moveTo(p.x,p.y-half));
      for(let i=section.samples.length-1;i>=0;i--){
        const p=section.samples[i];ctx.lineTo(p.x,p.y+half);
      }
      ctx.closePath();ctx.clip();
      ctx.font=`500 ${config.fontSize}px "DM Sans",sans-serif`;
      ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillStyle=section.front?"rgba(255,245,222,.93)":"rgba(255,248,233,.78)";
      const direction=section.points[3][0]<section.points[0][0]?-1:1;
      const shift=mod(phase,textPeriod);
      for(let base=-textPeriod;base<totalLength+textPeriod;base+=textPeriod){
        for(const glyph of glyphs){
          const offset=direction<0?textPeriod-glyph.offset:glyph.offset;
          const d=base+offset+shift;
          if(d<section.start||d>=section.end)continue;
          const p=atDistance(section,d);
          let angle=Math.atan2(p.dy,p.dx);
          if(p.dx<0)angle+=Math.PI;
          const scale=Math.max(.25,Math.abs(p.dx)/Math.hypot(p.dx,p.dy));
          ctx.save();
          ctx.translate(p.x,p.y);
          ctx.rotate(angle);ctx.scale(scale,1);
          ctx.fillText(glyph.char,0,0);
          ctx.restore();
        }
      }
      ctx.restore();
    }

    function makeSurface(front){
      const layer=document.createElement("canvas");
      layer.width=1100;layer.height=850;
      const c=layer.getContext("2d");
      sections.filter(s=>s.front===front).forEach(s=>{
        const pts=s.samples,half=config.ribbonHeight/2;
        const g=c.createLinearGradient(100,300,880,650);
        g.addColorStop(0,s.colors[0]);
        g.addColorStop(.5,s.colors[1]);
        g.addColorStop(1,s.colors[2]);
        c.beginPath();
        pts.forEach((p,i)=>i?c.lineTo(p.x,p.y-half):c.moveTo(p.x,p.y-half));
        for(let i=pts.length-1;i>=0;i--)c.lineTo(pts[i].x,pts[i].y+half);
        c.closePath();c.fillStyle=g;c.fill();
        [-half,half].forEach((off,i)=>{
          c.beginPath();
          pts.forEach((p,j)=>j?c.lineTo(p.x,p.y+off):c.moveTo(p.x,p.y+off));
          c.strokeStyle=i?"#c94d1533":"#fff0bdbb";
          c.lineWidth=i?.8:1.3;c.stroke();
        });
      });
      return layer;
    }
    const rearSurface=makeSurface(false);
    const frontSurface=makeSurface(true);

    function draw(){
      const dpr=Math.min(devicePixelRatio||1,2);
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.clearRect(0,0,width,height);
      const scale=Math.min(width/900,height/800);
      ctx.translate((width-900*scale)/2,(height-800*scale)/2);
      ctx.scale(scale,scale);

      ctx.drawImage(rearSurface,0,0);
      sections.filter(s=>!s.front).forEach(paintText);
      if(avatar){
        const ratio=avatar instanceof HTMLImageElement
          ?avatar.naturalHeight/avatar.naturalWidth
          :avatar.height/avatar.width;
        ctx.drawImage(avatar,20,-35,860,860*ratio);
      }
      ctx.drawImage(frontSurface,0,0);
      sections.filter(s=>s.front).forEach(paintText);
    }
    function resize(){
      const rect=canvas.getBoundingClientRect();
      width=rect.width;height=rect.height;
      const dpr=Math.min(devicePixelRatio||1,2);
      canvas.width=Math.round(width*dpr);
      canvas.height=Math.round(height*dpr);
      draw();
    }
    function tick(time){
      raf=0;
      if(!last)last=time;
      if(!paused)phase+=Math.min((time-last)/1000,.05)*config.speed;
      last=time;draw();
      if(!paused&&!document.hidden)raf=requestAnimationFrame(tick);
    }
    function start(){
      last=0;
      if(!raf&&!paused&&!document.hidden)raf=requestAnimationFrame(tick);
    }
    function updateControl(){
      const button=document.getElementById("motion");
      button.textContent=paused?"▶ Play ribbon":"Ⅱ Pause ribbon";
      button.setAttribute("aria-pressed",String(paused));
    }
    document.getElementById("motion").onclick=()=>{
      paused=!paused;updateControl();start();
    };
    reducedMotion.addEventListener("change",e=>{
      paused=e.matches;updateControl();start();
    });
    document.addEventListener("visibilitychange",()=>{
      if(document.hidden){cancelAnimationFrame(raf);raf=0}else start();
    });
    const image=new Image();
    image.onload=()=>{
      avatar=image;
      draw();
    };
    image.src="./cyber_avatar.png";
    new ResizeObserver(resize).observe(canvas);
    document.fonts.ready.then(()=>{prepareText();draw()});
    updateControl();start();
  </script>
</body>
</html>
